# One-click public demo on Render (free plan). See "Share a public demo" in the README.
# The free plan's disk is temporary, so the demo data reloads fresh whenever the server restarts.
services:
  - type: web
    name: siteroll-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      # Ask SiteRoll (optional): paste a Claude API key from console.anthropic.com when Render asks.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASK_DAILY_LIMIT
        value: "300"
      # Invite-only (recommended): a long private password for the demo login. People you send an
      # invite link to (Settings → Invite people) get in without it.
      - key: AGENCY_PASSWORD
        sync: false
      # Real WhatsApp and texts (optional): see "WhatsApp" in the README.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      # Real email (optional): see "Email" in the README.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
